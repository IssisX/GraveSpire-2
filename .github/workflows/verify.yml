name: verify

on:
  push:
  pull_request:

jobs:
  native-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run coupled reference cases
        run: make test

  linux-gdextension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install scons
      - name: Build GDExtension
        run: scons api_version=4.7 platform=linux target=template_debug -j2
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: gravespire-linux-gdextension
          path: game/bin/*.so
