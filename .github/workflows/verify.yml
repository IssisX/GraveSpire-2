name: verify

on:
  push:
  pull_request:

jobs:
  act1-web:
    name: Act I web client — typecheck, reference cases, production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Authority reference cases
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build

  native-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run coupled reference cases
        run: make test

  linux-gdextension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install scons
      - name: Build GDExtension
        run: scons api_version=4.7 platform=linux target=template_debug -j2
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: gravespire-linux-gdextension
          path: game/bin/*.so
