name: android-apk

on:
  push:
    branches:
      - Grok
      - Claude
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  apk:
    name: Assemble Act I debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release channel for this branch
        id: channel
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            Grok) tag=grok-act1-apk; name="GRAVESPIRE Act I - debug APK (Grok)" ;;
            *)    tag=claude-act1-apk; name="GRAVESPIRE Act I - debug APK (Claude)" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Act I web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage web into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a web/dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$SM sdk=$SDK"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/gravespire-act1-debug.apk
          ls -lh dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravespire-act1-debug-${{ github.ref_name }}
          path: dist-apk/gravespire-act1-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.name }}
          body: |
            Debug APK for the Fold, built from `${{ github.ref_name }}` at ${{ github.sha }}.

            1. Tap the APK below.
            2. Allow install from GitHub if Android asks.
            3. Left thumb walks. Right side looks. One Action control does what
               the world offers; hold it when more than one thing is possible.
               Machine verbs appear only while you are operating that machine.

            This is Act I as a WebView around the TypeScript/Three.js bay running a
            declared reduced mechanical model. It is not the Godot/C++ cell on `main`,
            and it is not GDD §16 completeness.
          prerelease: true
          make_latest: false
          files: dist-apk/gravespire-act1-debug.apk
          target_commitish: ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
